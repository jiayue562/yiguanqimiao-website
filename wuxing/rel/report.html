<script>
(function(){
  var KEYS = { self: "wxr_v1_self", other: "wxr_v1_other" };
  var HISTKEYS = { self: "wxr_hist_v1_self", other: "wxr_hist_v1_other" };
  function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function loadHist(k) { try { var v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString("zh-CN"); }
  var sSelf = load(KEYS.self), sOther = load(KEYS.other);
  var selfDone = !!(sSelf && sSelf.done), otherDone = !!(sOther && sOther.done);
  var params = new URLSearchParams(location.search);
  var mode = params.get("mode");
  if (!mode) mode = selfDone && otherDone ? "rel" : (selfDone ? "self" : (otherDone ? "other" : "none"));
  /* rel 模式守卫：双卷齐备才进关系报告，缺卷回落 */
  if (mode === "rel" && !(selfDone && otherDone)) {
    mode = selfDone ? "self" : (otherDone ? "other" : "none");
  }
  /* 断法自选（R4 输入，存本地） */
  var DUAN_KEY = "wxr_rel_duan_v1";
  var REV_KEY = "wxr_rel_review_v1";
  function loadDuan() {
    try { var v = JSON.parse(localStorage.getItem(DUAN_KEY) || "null"); return (v && ["水","金","木","火","土"].indexOf(v.duan) !== -1) ? v : null; } catch (e) { return null; }
  }
  window.pickDuan = function(d) {
    localStorage.setItem(DUAN_KEY, JSON.stringify({ duan: d, ts: Date.now() }));
    location.reload();
  };
  window.resetDuan = function() {
    localStorage.removeItem(DUAN_KEY);
    location.reload();
  };
  /* 复盘预约（R7 输入：方式 + 默认第 13 周复测日） */
  window.saveReview = function(way) {
    var d = new Date(Date.now() + 13 * 7 * 86400000).toISOString().slice(0, 10);
    localStorage.setItem(REV_KEY, JSON.stringify({ way: way, date: d, ts: Date.now() }));
    location.reload();
  };
  window.resetReview = function() {
    localStorage.removeItem(REV_KEY);
    location.reload();
  };
  var root = document.getElementById("root");
  var h = "";

  if (mode === "none") {
    root.innerHTML = "<div class='card'><p>未找到作答记录。请先完成自测卷或他测卷。</p><p><a class='btn' href='index.html'>返回入口</a></p></div>";
    return;
  }

  var selfRes = selfDone ? scoreQuiz(sSelf.ans, QUIZ_DATA) : null;
  var otherRes = otherDone ? scoreQuiz(sOther.ans, QUIZ_DATA) : null;
  var otherName = (sOther && sOther.name) ? sOther.name : "TA";

  /* ---------- 词域入口：主行∩答是词（悟空 2026-11-16 词域纪律） ---------- */
  function mwOf(res) { return mainWords(res); }
  function wordsIn(list, lo, hi) {
    return list.filter(function(w) { return w.layer >= lo && w.layer <= hi; });
  }

  /* ---------- M0 报告头：使用说明 + 边界 ---------- */
  function m0Head(res, mw, who) {
    var introHtml = "";
    RT.intro.forEach(function(line, i) {
      var txt = line.replace("___", String(mw.length));
      if (i === 1) {
        txt = "本次全卷答「是」共 " + res.total + " 个词，其中" + who + "主型行 " + mw.length + " 个——报告所有判断只引用这 " + mw.length + " 个词，其他行的词不进入描述（词域纪律）。";
      }
      introHtml += "<p class='li-row'><span class='lf'>" + txt + "</span></p>";
    });
    return "<div class='card'><h3>这份报告怎么读</h3>" + introHtml
      + "<p class='muted' style='margin-top:8px'>边界：以下内容属能量状态描述，供自我探索与关系成长参考——非医学诊断、不预测命运。</p></div>";
  }

  /* ---------- M1 一句话结论（一屏六行，每行 ≤30 字） ---------- */
  function m1Conclusion(res, mw, owner) {
    var t = res.typeState === "能量未显" ? null : TYPES[res.mainType];
    var mainRow = res.mainType || res.sorted[0];
    var cl = clarity(res);
    var row1;
    if (!t) {
      row1 = "能量未显（暂定主行 " + mainRow + "）";
    } else if (cl.type === "模糊") {
      var bk = RT_blurKey(res.sorted[0], res.sorted[1]);
      row1 = mainRow + " 与 " + res.sorted[1] + " 能量接近（暂以" + mainRow + "叙述）";
    } else {
      row1 = t.name + "（" + t.xiang + "）";
    }
    var ratio = "主导" + res.sorted[0] + " " + res.P[res.sorted[0]] + " · 辅助" + res.sorted[1] + " " + res.P[res.sorted[1]] + " · 待补" + res.sorted[4] + " " + res.P[res.sorted[4]];
    var sumRow = t ? RT_summaryPick(mainRow, res) : "按暂定主行读下方状态描述，暂不给型结论";
    var tellRow = t ? RT_tellPick(mainRow, res) : "先把状态安顿好，型会自己显出来";
    var s = "<h2>一句话结论</h2><div class='card'><table class='concl'>"
      + "<tr><td>" + owner + "主型</td><td><strong>" + row1 + "</strong></td></tr>"
      + "<tr><td>核心驱动力</td><td>" + (t ? RT.drive[mainRow] : "能量未显——先看九层状态") + "</td></tr>"
      + "<tr><td>五行配比</td><td>" + ratio + "</td></tr>"
      + "<tr><td>判型清晰度</td><td>型 " + cl.type + " ｜ 阴阳 " + cl.yinyang + " ｜ 九层 " + cl.layer + " —— 总档 <strong>" + cl.grade + "</strong></td></tr>"
      + "<tr><td>一句话总结</td><td>" + sumRow + "</td></tr>"
      + "<tr><td>最想告诉你</td><td>" + tellRow + "</td></tr>"
      + "</table></div>";
    return s;
  }

  /* ---------- M2 主型判定：意象/特质挂词/代价/配比表/清晰度 ---------- */
  function m2Type(res, mw, owner) {
    var t = res.typeState === "能量未显" ? null : TYPES[res.mainType];
    if (!t) {
      return "<h2>主型判定</h2><div class='card'><p>得分最高为 " + res.P[res.sorted[0]] + " 分（" + res.sorted[0] + " 行，满分 100），未达定型标准（≥11 分）。暂以得分最高行（" + res.sorted[0] + "）作暂定主行，以下按能量状态描述输出，不给型结论。</p></div>";
    }
    var mainRow = res.mainType;
    var cl = clarity(res);
    var s = "<h2>主型判定</h2><div class='card'>";
    s += "<p style='margin-top:0'><em>" + t.metaphor + "</em>　" + t.core + "</p>";
    /* 模糊档：先声明 */
    if (cl.type === "模糊") {
      var bk = RT_blurKey(res.sorted[0], res.sorted[1]);
      s += "<div class='blurbox'><strong>先说清楚一件事：</strong>你的【" + res.sorted[0] + "】与【" + res.sorted[1] + "】能量接近，本报告暂以" + mainRow + "行叙述。" + (bk ? bk.txt : "两行同为你的可用资源，只是叙述只走主行。") + "</div>";
    }
    /* 特质画像：表现 + 显现场景 + 挂答是词 */
    s += "<h4>特质画像（每条都挂着你自己确认的词）</h4>";
    t.traits.forEach(function(tr, i) {
      var dim = (RT.traitDim[mainRow] || [])[i];
      var w = RT_dimWord(mw, dim);
      var wordHtml = w ? "你确认了「<strong>" + w.word + "</strong>」（L" + w.layer + "）——" : "";
      s += "<p class='traitline'><strong class='t'>" + (i + 1) + "．" + tr + "</strong>——" + ((RT.traitScene[mainRow] || [])[i] || "") + "<br><span class='muted'>" + wordHtml + "这个词就是这条特质在你身上的落点。</span></p>";
    });
    /* 天然代价 */
    s += "<h4>这一行的天然代价</h4><p>" + RT.cost[mainRow] + "</p>";
    /* 配比表：三行 */
    s += "<h4>五行配比（满分 100）</h4><table class='qtable'><tr><th>角色</th><th>行</th><th>得分</th><th>它在说明什么</th></tr>"
      + "<tr><td><strong>主导</strong></td><td>" + res.sorted[0] + "</td><td>" + res.P[res.sorted[0]] + "</td><td>你的默认反应方式——遇事最先启动的那股劲</td></tr>"
      + "<tr><td><strong>辅助</strong></td><td>" + res.sorted[1] + "</td><td>" + res.P[res.sorted[1]] + "</td><td>你的第二资源——主导不够用时顶上</td></tr>"
      + "<tr><td><strong>待补</strong></td><td>" + res.sorted[4] + "</td><td>" + res.P[res.sorted[4]] + "</td><td>你最薄的一环——成长空间在这里</td></tr></table>"
      + "<p class='muted'>没有纯粹的某一行人——每个人五行俱全，配比说的是相对强弱，不是「你只有这一行」。</p>";
    /* 清晰度表 */
    s += "<h4>判型清晰度</h4><table class='qtable'><tr><th>判定项</th><th>结果</th><th>口径</th></tr>"
      + "<tr><td>型清晰度</td><td>" + cl.type + "</td><td>主行与次行百分制差：" + (res.P[res.sorted[0]] - res.P[res.sorted[1]]) + " 个点</td></tr>"
      + "<tr><td>阴阳清晰度</td><td>" + cl.yinyang + "</td><td>" + (res.yinYang && res.yinYang.verdict !== "阴阳未显" ? "阳 " + res.yinYang.yangPct + "% vs 阴 " + res.yinYang.yinPct + "%" : "两极词不足，阴阳未显") + "</td></tr>"
      + "<tr><td>九层清晰度</td><td>" + cl.layer + "</td><td>" + (cl.layer === "清楚" ? "主行词集中在同一段，位置明确" : (cl.layer === "一般" ? "主行词跨两个段" : "主行词跨三个段，位置拉得太开")) + "</td></tr></table>"
      + "<p class='blurbox' style='margin-top:6px'>" + RT.gradeSay[cl.grade] + "</p>";
    return s + "</div>";
  }

  /* ---------- M3 阴阳双面：占比 + 成对清单 + 零评判收尾 ---------- */
  function m3Yinyang(res, mw) {
    var mainRow = res.mainType || res.sorted[0];
    var yy = res.yinYang;
    var yangW = wordsIn(mw, 1, 3), yinW = wordsIn(mw, 7, 9);
    var s = "<h2>阴阳双面</h2><div class='card'>";
    if (!yy || yy.verdict === "阴阳未显") {
      s += "<p>" + mainRow + "行内两极（L1–L3 与 L7–L9）确认词不足，阴阳倾向未显——以下清单仍按你确认的词给出，供对照。</p>";
    } else {
      s += "<table class='qtable'><tr><th>阳面（L1–L3）</th><th>中间带（L4–L6）</th><th>阴面（L7–L9）</th></tr>"
        + "<tr><td><strong>" + yy.y + "</strong> 词</td><td>" + yy.m + " 词</td><td><strong>" + yy.n + "</strong> 词</td></tr></table>"
        + "<p>两极里阳占 " + yy.yangPct + "%、阴占 " + yy.yinPct + "%——判定：<strong>" + yy.verdict + "</strong>。</p>";
    }
    /* 阳面清单（复用 strengths + 转阴条件，挂 L1–3 答是词） */
    s += "<div class='pairgrid'><div class='pcol'><h4>阳面清单（通畅时的样子）</h4><ul>";
    (TYPES[mainRow].strengths).forEach(function(st, i) {
      var w = yangW.length ? yangW[i % yangW.length] : null;
      var turn = (RT.yangTurn[mainRow] || [])[i] || "";
      s += "<li>" + st + "。" + (turn ? "<span class='muted'>" + turn + "</span>" : "")
        + (w ? "<br><span class='muted'>例证：你确认了「" + w.word + "」（L" + w.layer + "）</span>" : "") + "</li>";
    });
    s += "</ul></div>";
    /* 阴面清单（零评判，挂 L7–9 答是词；词不足 2 个不渲染整节——证据不足不硬写） */
    s += "<div class='pcol'><h4>阴面清单（受限时的表达）</h4>";
    if (yinW.length >= 2) {
      s += "<ul>";
      (RT.yinList[mainRow] || []).forEach(function(it, i) {
        var w = yinW[i % yinW.length];
        s += "<li><strong>表现：</strong>" + it.p + "。<br><strong>实际影响：</strong>" + it.f + "。"
          + "<br><span class='muted'>例证：你确认了「" + w.word + "」（L" + w.layer + "）</span></li>";
      });
      s += "</ul>";
    } else {
      s += "<p class='muted'>你本次确认的不健康段词不足 2 个——阴面证据不足，此处不硬写。这是好状态。</p>";
    }
    s += "</div></div>";
    s += "<div class='closing'>阴面不是缺点，是这股能量在受限时的表达。同一股力量，通了是阳，堵了是阴。</div>";
    return s + "</div>";
  }

  /* ---------- M4 九层定位（五段式，层分布主行化） ---------- */
  function m4Layers(res, mw) {
    var mainRow = res.mainType || res.sorted[0];
    var cl = clarity(res);
    var mp = res.mainPeak, mVal = res.mainLayers || {};
    var mx = Math.max(1, res.mainPeakVal || 1);
    var s = "<h2>九层定位</h2><div class='card'>";
    if (!mp) {
      s += "<p>" + mainRow + "行内暂无可定位的层（该行确认词不足以分层）——先看五行配比与整体状态。</p></div>";
      return s;
    }
    var seg = mp <= 3 ? 1 : (mp <= 6 ? 2 : 3);
    var mpWords = mw.filter(function(w) { return w.layer === mp; });
    /* ① 当前层 */
    s += "<h4>① 你现在站在哪一层</h4><p><strong>L" + mp + " · " + LAYER_NAMES[mp] + "（" + RT.segLead[seg] + "）</strong></p>"
      + "<p>" + (RT.L45[mainRow] && RT.L45[mainRow][mp] || "") + "</p>"
      + (mpWords.length ? "<p class='muted'>这一层你确认了：" + mpWords.slice(0, 5).map(function(w) { return "「" + w.word + "」"; }).join("、") + "</p>" : "");
    /* ② 往上看 */
    var up = Math.max(1, mp - 2), sUp = "";
    for (var k = mp - 1; k >= up; k--) {
      if (k < 1) break;
      var uw = mw.filter(function(w) { return w.layer === k; });
      sUp += "<p><strong>L" + k + " " + LAYER_NAMES[k] + "：</strong>" + (RT.L45[mainRow] && RT.L45[mainRow][k] || "")
        + (uw.length ? "<span class='muted'>（这层你确认过 " + uw.length + " 个词）</span>" : "<span class='muted'>（这层本次没有你的词——它是你往上的路）</span>") + "</p>";
    }
    s += "<h4>② 往上看（L" + (mp - 1 > 0 ? mp - 1 : "—") + (mp - 2 > 0 ? "、L" + (mp - 2) : "") + " 长什么样）</h4>" + (sUp || "<p class='muted'>已在顶层附近。</p>");
    /* ③ 往下滑 */
    var dn = Math.min(9, mp + 2), sDn = "";
    for (var k2 = mp + 1; k2 <= dn; k2++) {
      if (k2 > 9) break;
      var dw = mw.filter(function(w) { return w.layer === k2; });
      sDn += "<p><strong>L" + k2 + " " + LAYER_NAMES[k2] + "：</strong>" + (RT.L45[mainRow] && RT.L45[mainRow][k2] || "")
        + (dw.length ? "<span class='muted'>（注意：这层你已确认 " + dw.length + " 个词）</span>" : "") + "</p>";
    }
    s += "<h4>③ 往下看（如果能量继续受限）</h4>" + (sDn || "<p class='muted'>已在底层附近——往上的路就是全部的路。</p>");

    s += "<h4 style='margin-top:18px'>" + mainRow + "行九层分布（只显示主型行）</h4>";
    for (var k3 = 9; k3 >= 1; k3--) {
      var sg = k3 <= 3 ? 1 : (k3 <= 6 ? 2 : 3);

      s += "<div class='bar-row'><div class='lbl'>L" + k3 + " " + LAYER_NAMES[k3] + "</div><div class='track'><div class='fill' style='width:" + (v / mx * 100) + "%;background:" + SEG_COLOR[sg] + "'></div></div><div class='val'>" + v + "</div></div>";
    }

    s += "<div class='stat3' style='margin-top:16px'>"
      + "<div class='stat'><div class='num' style='color:" + SEG_TEXT[1] + "'>" + res.seg[1] + "</div><div class='cap'>健康段</div></div>"
      + "<div class='stat'><div class='num' style='color:" + SEG_TEXT[2] + "'>" + res.seg[2] + "</div><div class='cap'>一般段</div></div>"
      + "<div class='stat'><div class='num' style='color:" + SEG_TEXT[3] + "'>" + res.seg[3] + "</div><div class='cap'>不健康段</div></div>"
      + "<div class='stat'><div class='num'>" + (res.GHI === null ? "—" : res.GHI) + "</div><div class='cap'>GHI</div></div></div>"
      + "<p class='muted'>口径标注：三段计数与 GHI 为含全五行作答的整体参考；层分布图只显示主型行（词域纪律）。</p>";
    return s + "</div>";
  }

  /* ---------- M5 答是词画像（词域纪律：仅主行） ---------- */
  function m5Words(res, mw) {
    if (!mw.length) return "";
    var s = "<h2>答是词画像（全报告的词级总账）</h2><div class='card'>"
      + "<p class='muted' style='margin-top:0'>以下是你主型行内全部答「是」的词——报告的每一条判断都出自这里，逐词可核对。</p>";
    [[1, 3, "健康段"], [4, 6, "一般段"], [7, 9, "不健康段"]].forEach(function(gr) {
      var ws = wordsIn(mw, gr[0], gr[1]);
      if (!ws.length) return;
      s += "<h4>" + gr[2] + "（" + ws.length + " 词）</h4><div class='wordchips'>";
      ws.forEach(function(w) {
        s += "<span class='chip' style='color:" + EL_TEXT[w.e] + ";border-color:" + EL_TEXT[w.e] + "'>" + w.word + " <span class='muted'>L" + w.layer + "</span></span>";

  /* ---------- M6 词条释义（词域纪律：仅主行折叠） ---------- */
  function kbSection(ans, who, mainRow) {
    if (!window.WXKB || !ans || !mainRow) return "";
    var list = [];
    QUIZ_DATA.forEach(function(it, i) {
      if (ans[i] !== true || it.e !== mainRow) return;
      list.push(it);
    });
    if (!list.length) return "";
    var s = "<h2>知识库延伸 · " + who + "主型行确认的词汇释义</h2>"
      + "<p class='muted'>只折叠主型行（" + mainRow + "行，共 " + list.length + " 词）——释义取自《五行人格学人格词汇分类与解释表（定稿）》。可逐词核对理解是否与体系口径一致；同一维度内的词互为边界，读释义末句「区别于……」即可辨同异。</p>";
    var byX = {}, order = [];
    list.forEach(function(it) {
      if (!byX[it.xiang]) { byX[it.xiang] = []; order.push(it.xiang); }
      byX[it.xiang].push(it);
    });
    s += "<details class='kb'><summary><strong>" + mainRow + "行（主型）</strong> · 确认 " + list.length + " 词 · 展开看释义与归类</summary><div class='card'>";
    order.forEach(function(x) {
      s += "<h4>" + x + " 维度</h4><ul class='kblist'>";
      byX[x].sort(function(a, b) { return a.layer - b.layer; }).forEach(function(it) {
        var k = (window.WXKB.words || {})[it.word] || {};
        var lx = (window.WXLEX && window.WXLEX.words) ? window.WXLEX.words[it.word] : null;
        s += "<li><strong>" + it.word + "</strong>　<span class='muted'>L" + it.layer + (k.f ? " · " + k.f : " · 题库词条") + "</span><br>"
          + "<span class='kbdef'>" + (k.d || it.def || "") + "</span>"
          + (lx ? "<br><span class='kbattr'>原始词→属性词：" + lx.e + "　<span class='muted'>" + lx.n + "</span></span>" : "")
          + "</li>";
      });
      s += "</ul>";
    });
    s += "</div></details>";
    s += "<p class='kbmeta'>出处：" + (window.WXKB.meta && window.WXKB.meta.src ? window.WXKB.meta.src : "《五行人格学人格词汇分类与解释表（定稿）》")
      + (window.WXKB.meta && window.WXKB.meta.srcUrl ? "　<a href='" + window.WXKB.meta.srcUrl + "' target='_blank' rel='noopener'>在公开知识库查看原表 →</a>" : "")
      + (window.WXKB.meta && window.WXKB.meta.stdUrl ? "　｜　<a href='" + window.WXKB.meta.stdUrl + "' target='_blank' rel='noopener'>题目重排清单（唯一标准）→</a>" : "")
      + (window.WXKB.meta && window.WXKB.meta.quizUrl ? "　｜　<a href='" + window.WXKB.meta.quizUrl + "' target='_blank' rel='noopener'>重做测评 →</a>" : "")
      + "　（释义随版本编译固定，保证同一份报告可复现、可追溯）</p>";
    return s;
  }

  /* ---------- M14 附录 ---------- */
  function m14Appendix() {
    var A = RT.appendix;

      + "<h4>1．这份报告是怎么来的</h4><p>" + A.how + "</p>"

  /* ---------- 统一渲染件（A 自测 / B 第一部分 / 他测摘要 共用） ---------- */
  function renderSelfCore(res, ans, owner, store, withAppendix) {
    var mw = mwOf(res);
    var a = buildAdvice(res);
    var mainRow = res.mainType || res.sorted[0];
    var out = "";
    out += m0Head(res, mw, owner);
    out += m1Conclusion(res, mw, owner);

    out += m3Yinyang(res, mw);
    out += m4Layers(res, mw);
    out += "<h2>起点建议</h2><div class='card'>" + a.html + "</div>";
    out += m5Words(res, mw);
    out += kbSection(ans, owner, mainRow);
    if (withAppendix !== false) out += m14Appendix();
    return out;
  }

  function metaLine(store, label) {
    return label + "　作答 " + new Date(store.ts || Date.now()).toLocaleDateString("zh-CN")
      + "　有效作答 " + Object.keys(store.ans).filter(function(k){ return store.ans[k] === true; }).length + " 个「是」词";
  }

  /* ---------- 测评历史与对比（持久化存档：wxr_hist_v1_self / wxr_hist_v1_other） ---------- */
  window.HIST_CTX = {};
  function histSection(sec, histKey, res, owner, curName) {
    window.HIST_CTX[sec] = { histKey: histKey, curRes: res, owner: owner, curName: curName };
    return "<h2>测评历史与对比（" + owner + "）</h2><div class='card' id='" + sec + "Box'><p class='muted'>加载中…</p></div>";
  }
  window.histFill = function(sec, idxStr) {
    var c = window.HIST_CTX[sec]; if (!c) return;
    var box = document.getElementById(sec + "Box"); if (!box) return;
    var hist = loadHist(c.histKey);
    if (!hist.length) {
      box.innerHTML = "<p class='muted'>暂无历史存档。在入口页或答题页点「重新开始」重做并完成后，此处自动给出与上一轮的得分对比与连续变化。</p>";
      return;
    }
    var idx = hist.length - 1;
    if (idxStr !== undefined && idxStr !== null && idxStr !== "") {
      var ni = parseInt(idxStr, 10);
      if (!isNaN(ni)) idx = Math.min(Math.max(ni, 0), hist.length - 1);
    }
    var cur = c.curRes;
    var base = scoreQuiz(hist[idx].ans, QUIZ_DATA);
    var curMain = cur.mainType || cur.sorted[0];
    var baseMain = base.mainType || base.sorted[0];
    function dc(a, b) {
      var d = b - a;
      if (d > 0) return "<span style='color:#3B6D11;font-weight:600'>▲ +" + d + "</span>";
      if (d < 0) return "<span style='color:#C0392B;font-weight:600'>▼ " + d + "</span>";
      return "<span class='muted'>0</span>";
    }
    function typeStr(res) { return res.typeState === "能量未显" ? "能量未显" : (res.mainType || res.sorted[0]) + "行人"; }
    function pctStr(res) {
      var yy = res.yinYang;
      if (!yy || yy.verdict === "阴阳未显") return "阴阳未显";
      return "阳 " + yy.yangPct + "% / 阴 " + yy.yinPct + "%（" + yy.verdict + "）";
    }
    function layerStr(res) { return (res.mainPeak || res.peak) ? "L" + (res.mainPeak || res.peak) : "—"; }
    function layerCmp(a, b) {
      if (!a || !b) return "—";
      if (b < a) return "<span style='color:#3B6D11;font-weight:600'>↑ L" + a + "→L" + b + "（向健康段移动）</span>";
      if (b > a) return "<span style='color:#C0392B;font-weight:600'>↓ L" + a + "→L" + b + "（向深层移动）</span>";
      return "持平（L" + b + "）";
    }
    var s = "";
    if (hist.length > 1) {
      s += "<p><strong>选择对比基准：</strong><select onchange=\"window.histFill('" + sec + "', this.value)\">";
      for (var i = hist.length - 1; i >= 0; i--) {
        s += "<option value='" + i + "'" + (i === idx ? " selected" : "") + ">第 " + (i + 1) + " 轮 · " + fmtDate(hist[i].ts) + (i === hist.length - 1 ? "（最近）" : "") + "</option>";
      }
      s += "</select></p>";
    }
    s += "<h4>五行得分对比（满分 100）：第 " + (idx + 1) + " 轮（" + fmtDate(hist[idx].ts) + "）→ 本次</h4>"
      + "<table class='qtable'><tr><th>行</th><th>上次</th><th>本次</th><th>变化</th></tr>";
    cur.sorted.forEach(function(e) {
      s += "<tr><td><strong>" + e + "</strong>" + (curMain === e ? "（主行）" : "") + "</td><td>" + base.P[e] + "</td><td>" + cur.P[e] + "</td><td>" + dc(base.P[e], cur.P[e]) + "</td></tr>";
    });
    s += "</table>";
    var typeChg = baseMain !== curMain;
    s += "<h4 style='margin-top:12px'>关键判定变化</h4><ul>"
      + "<li><strong>主导类型</strong>：" + typeStr(base) + "（" + base.P[baseMain] + "）→ " + typeStr(cur) + "（" + cur.P[curMain] + "）" + (typeChg ? "　<span style='color:#854F0B;font-weight:600'>⚠ 主行改变</span>" : "") + "</li>"
      + "<li><strong>阴阳属性</strong>：" + pctStr(base) + " → " + pctStr(cur) + "</li>"
      + "<li><strong>峰值层</strong>（主行内）：" + layerCmp(base.mainPeak, cur.mainPeak) + "</li>"
      + "<li><strong>三段能量</strong>：健康 " + base.seg[1] + "→" + cur.seg[1] + "（" + dc(base.seg[1], cur.seg[1]) + "）｜一般 " + base.seg[2] + "→" + cur.seg[2] + "（" + dc(base.seg[2], cur.seg[2]) + "）｜不健康 " + base.seg[3] + "→" + cur.seg[3] + "（" + dc(base.seg[3], cur.seg[3]) + "；不健康段下降＝改善）</li>"
      + "<li><strong>GHI</strong>：" + (base.GHI === null ? "—" : base.GHI) + " → " + (cur.GHI === null ? "—" : cur.GHI) + (base.GHI !== null && cur.GHI !== null ? "（" + dc(base.GHI, cur.GHI) + "）" : "") + "</li></ul>"
      + "<p class='muted'>▲/绿＝数值升高，▼/红＝数值下降。五行得分与健康段计数升高通常为改善信号；不健康段计数与峰值层号下降为改善信号。</p>";
    s += "<h4 style='margin-top:12px'>历次测评轨迹（含本次）</h4><table class='qtable'><tr><th>轮次</th><th>日期</th>"
      + (sec === "histOther" ? "<th>对象</th>" : "") + "<th>主导型</th><th>主行得分</th><th>峰值层</th></tr>";
    hist.forEach(function(rec, i) {
      var r = scoreQuiz(rec.ans, QUIZ_DATA);
      var mt = r.mainType || r.sorted[0];
      s += "<tr><td>第 " + (i + 1) + " 轮</td><td>" + fmtDate(rec.ts) + "</td>"
        + (sec === "histOther" ? "<td>" + (rec.name || "TA") + "</td>" : "")
        + "<td>" + (r.typeState === "能量未显" ? "能量未显" : mt + "行人") + "</td><td>" + r.P[mt] + "</td><td>" + layerStr(r) + "</td></tr>";
    });
    s += "<tr style='background:#FAEEDA'><td><strong>本次</strong></td><td>" + fmtDate(Date.now()) + "</td>"
      + (sec === "histOther" ? "<td>" + (c.curName || "TA") + "</td>" : "")
      + "<td>" + typeStr(cur) + "</td><td>" + cur.P[curMain] + "</td><td>" + layerStr(cur) + "</td></tr>";
    s += "</table><p class='muted'>历史存档保留最近 20 轮，存在你的浏览器本地，不上传服务器。</p>";
    box.innerHTML = s;
  };

  /* ---------- 模式A：自测报告 ---------- */
  if (mode === "self") {
    h += "<h1>自测报告（关系测评 · 模式A）</h1><p class='muted'>" + metaLine(sSelf, "本人自测卷") + "</p>";

      h += "<div class='card' style='background:#FAEEDA'><p>他测卷已完成——<a class='btn' href='report.html?mode=rel'>查看完整关系测评报告</a></p></div>";
    } else {
      h += "<div class='card'><p>完成他测卷（我测 " + otherName + "）后，将自动生成<strong>关系测评报告</strong>（四象限 + 生克分型 + 双线功课）。</p><p><a class='btn' href='quiz.html?mode=other'>去做他测卷</a></p></div>";

  /* ---------- 他测摘要 ---------- */
  if (mode === "other") {
    h += "<h1>他测摘要（你眼中的 " + otherName + "）</h1><p class='muted'>" + metaLine(sOther, "他测卷") + "</p>";
    h += "<div class='card' style='background:#FAEEDA'><p><strong>视角边界</strong>：以下为「你眼中 " + otherName + "」的能量画像——是他测窗口的数据，不是 " + otherName + " 的自知。报告据此做关系分析，不作为对 " + otherName + " 的独立人格论断。</p></div>";
    h += renderSelfCore(otherRes, sOther.ans, "你眼中的 " + otherName, sOther);
    h += histSection("histOther", HISTKEYS.other, otherRes, "你眼中的 " + otherName, otherName);
    if (selfDone) {
      h += "<div class='card' style='background:#FAEEDA'><p>自测卷已完成——<a class='btn' href='report.html?mode=rel'>查看完整关系测评报告</a></p></div>";
    } else {
      h += "<div class='card'><p>完成自测卷后，将自动生成<strong>关系测评报告</strong>。</p><p><a class='btn' href='quiz.html?mode=self'>去做自测卷</a></p></div>";
    }

  }

  /* ---------- 模式B：完整关系测评报告（八块叙事 · v1.2 第一批） ---------- */
  var rel = computeRelation(sSelf.ans, sOther.ans, QUIZ_DATA);
  rel.otherName = otherName;
  var pack = relLessonPack(rel);
  var RT_R = RT.relText;
  var duanSel = loadDuan();
  var D = duanSel ? duanSel.duan : null;

  h += "<h1>关系测评报告</h1><p class='muted'>" + metaLine(sSelf, "自测卷") + "　｜　" + metaLine(sOther, "他测卷（" + otherName + "）") + "</p>";

  /* 断法自选卡（未认领时只渲染此卡——R4 输入） */
  if (!D) {
    h += "<div class='card'><h3>先认领一件事：你们卡在哪一断</h3>"
      + "<p>一段关系从「感觉到对方」到「真正碰上」，中间有五步。五步走完，一次接触才闭合；中间哪一步断了，关系就在哪一步卡住。填的时候只看一条：<strong>你们俩反复吵的那件事，最像下面哪一句？</strong></p>";
    ["水", "金", "木", "火", "土"].forEach(function(d) {
      h += "<p class='li-row'><button class='btn ghost' style='margin-right:8px' onclick=\"window.pickDuan('" + d + "')\">选 " + d + " 断</button>" + RT_R.duanQuote[d]
        + "　<span class='muted'>" + RT_R.duanTab[d].name + "</span></p>";
    });

  /* R1 一页速览（七行铁律，每行 ≤30 字） */
  function peakOf(res) { return res.mainPeak || res.peak || null; }
  function yinStr(res) {
    var yy = res.yinYang;
    if (!yy || yy.verdict === "阴阳未显") return "阴阳未显";
    return yy.verdict;

  function peakStr(res) {
    var p = peakOf(res);

  }
  var structShort = rel.dirText.split("（")[0];
  var r1 = "<h2>一页速览——你们卡在哪一句</h2><div class='card'><table class='concl'>"
    + "<tr><td>关系</td><td><strong>你（" + rel.P.mainType + "）与 " + otherName + "（" + rel.Q.mainType + "，在你眼中）</strong></td></tr>"
    + "<tr><td>结构</td><td>" + structShort + " · " + rel.verdict + "</td></tr>"
    + "<tr><td>" + otherName + "</td><td>" + peakStr(rel.otherRes) + "（按你的判断）</td></tr>"

  h += "<h3>关系行动 · 四象限分区措施</h3><div class='card'><ul>"

    + "<li><strong>投射区（" + rel.quad.projection.length + " 词）</strong>：求证练习——以具体事例核对该词是否属实，避免标签化 " + otherName + "；同时自照检查自己是否也有此词（自照用「找好处」降低防御）。</li>"
    + "<li><strong>防御区（" + rel.quad.defense.length + " 词）</strong>：暴露练习——「在我感到 X 之后，我告诉对方这个词」的词级表达微行为。</li>"
    + "<li><strong>空白区（" + rel.quad.blank.length + " 词）</strong>：不强制行动，聚合呈现「共同未开发区」——见上方行 × 层计数表。</li></ul></div>";

  h += "<h2>第六、七块 · 关系功课——化克为生与下一次开口</h2>";
  if (pack.shengCard) h += "<div class='lesson'>" + pack.shengCard + "</div>";
  if (pack.keCard) h += "<div class='lesson'>" + pack.keCard + "</div>";
  h += "<div class='lesson'>" + pack.daily + "</div>";
  h += "<div class='lesson'>" + pack.map90 + "</div>";

  /* R6.6 · 化克为生落点（克点词对直接对接为策略） */
  if (rel.segTypeKey === "ke" && rel.segMap[3].points.length) {
    h += "<div class='lesson'><h3>化克为生落点（来自层面生克图谱的克点）</h3><ul>";
    rel.segMap[3].points.forEach(function(pt) {
      var yRow = REL_SHENG[pt.tgt.e];
      var tgtWho = pt.side === "self" ? otherName : "你";
      h += "<li><strong>" + (pt.side === "self" ? "我（自测）" : otherName + "（他测）") + "的「" + pt.src.word + "」克" + tgtWho + "的「" + pt.tgt.word + "」</strong> → " + tgtWho + "养" + yRow + "行：" + RT_R.yCarrier[yRow] + "。</li>";
    });
    h += "</ul><p class='muted'>两条铁律：杠杆点在「生」处不在「克」处——不去顶压你的力量，去养中间那一行；谁难受谁改变——先从自己这一侧动。内圈不由你来克：最亲的关系里，克交给第三方（制度/规则/双方都接受的人）。</p></div>";
  }

  /* 第七块 · 关系功课（四原则 + 下一次开口 + 复盘预约） */
  h += "<h3>关系功课 · 四条原则与下一次开口</h3><div class='card'>";
  h += "<h4 style='margin-top:0'>四条关系原则</h4><ul>";
  RT_R.r7Principles.forEach(function(p) { h += "<li><strong>" + p[0] + "</strong>：" + p[1] + "。</li>"; });
  h += "</ul>";
  h += "<h4>下一次开口，可以这样说（按你认领的" + D + "断）</h4>"
    + "<p><strong>" + RT_R.duanSay[D][0] + "</strong>　<span class='muted'>" + RT_R.duanSay[D][1] + "</span></p>"
    + "<p class='muted'>其余断法的开口句（一句带过）：" + ["水", "金", "木", "火", "土"].filter(function(x) { return x !== D; }).map(function(x) { return x + "断" + RT_R.duanSay[x][0]; }).join("；") + "。</p>";
  h += "<h4>一个微行为（B=MAP，只给一个）</h4><p class='muted'>见上方功课包「主克课 / 主生课」——动机 / 能力 / 提示三件套已按克源词锚定，不再重复给第二个。给三个动作等于没给。</p>";
  /* 复盘预约（交互） */
  var rev = load(REV_KEY);
  h += "<h4>复盘预约（不预约，这一块就是空的）</h4><p>" + RT_R.reviewIntro + "</p>";
  var defDate = new Date(Date.now() + 13 * 7 * 86400000).toISOString().slice(0, 10);
  if (rev && rev.way && rev.date) {
    h += "<div class='closing'>已预约：复测日 " + rev.date + " · " + (rev.way === "both" ? "两个人一起看" : "各自看，再对笔记") + "。</div>"
      + "<p>" + RT_R.reviewLook + "</p>"
      + "<p><button class='btn ghost' onclick='window.resetReview()'>改约</button></p>";
  } else {
    h += "<p class='li-row'><strong>方式</strong>：<button class='btn ghost' onclick=\"window.saveReview('both')\">两个人一起看</button> <button class='btn ghost' style='margin-left:6px' onclick=\"window.saveReview('solo')\">各自看，再对笔记</button></p>"
      + "<p class='muted'>默认复测日为第 13 周（" + defDate + "），预约后可在报告里改约。</p>";
  }
  h += "</div>";

  h += "<div class='card'><p><strong>复测提示</strong>：第 13 周（3 个月 ±7 天）用同一套卷重做双窗口，系统将对比克线（主克 K 分下降 ≥30%）与生线（主生 S 分维持 ≥95%）及双方峰值层位移，出四档判定（大效 / 显效 / 有效 / 未显效）。重做方式：入口页对应卷卡上点「重新开始」→ 重做完成 → 本报告「测评历史与对比」区自动给出与上一轮的得分差异与连续变化（关系指标四档对比属二期复测报告）。</p></div>";

  /* 第八块 · 附录（关系版边界，比自测报告更重） */
  h += "<h2>附录 · 这份关系报告的边界与可信度</h2><div class='card appx'>"
    + "<h4>1．边界声明（先说做不到的）</h4><p>" + RT_R.relAppx.boundary + "</p>"
    + "<div class='closing'>" + RT_R.relAppx.fixed + "</div>"
    + "<h4>2．它可能错在哪里</h4><p>" + RT_R.relAppx.wrong + "</p>"
    + "<h4>3．怎么验证</h4><p>" + RT_R.relAppx.verify + "</p>"
    + "<h4>4．数据来源标明</h4><p>" + RT_R.threeSrcBoth.replace(/\{name\}/g, otherName) + "</p><p class='muted'>" + RT_R.threeSrcWord + "</p>"
    + "<h4>5．概念速查</h4><p>一心三界五行九层三段、相生相克方向、五种断法、关系四象限（非乔哈里视窗）——完整口径见 <a href='baike.html'>百科与方法论</a>。</p>"
    + "</div>";

  document.getElementById("actions").style.display = "block";
  root.innerHTML = h;
  window.histFill("histSelf");
  window.histFill("histOther");
})();
</script>
</body>
</html>
