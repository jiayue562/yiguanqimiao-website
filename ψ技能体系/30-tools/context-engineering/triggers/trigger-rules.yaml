# 上下文工程触发规则

## P0 直接触发（权重 5）

```
上下文工程、优化上下文、会话摘要、
Prompt 工程、上下文注入、上下文质量检查、
"context engineering"、"optimize context"、
"summarize session"、"context health"
```

## P1 场景触发（权重 4）

```
"上下文太长了"、"压缩一下对话"、
"生成会话摘要"、"检查上下文质量"、
"配置这个 Skill 的上下文"、
"context is too long"、"compress conversation"
```

## P2 信号触发（权重 3）

```
"对话.*太长"、"记住.*内容"、
"上下文.*优化"、"会话.*摘要"
```

## 自动触发条件

### 会话完成后
- 条件：会话轮数 > 10
- 动作：自动生成会话摘要
- 优先级：高

### 上下文过长
- 条件：上下文 token > 100000
- 动作：自动优化压缩
- 优先级：高

### 定期健康检查
- 计划：每 4 小时
- 动作：上下文质量扫描
- 优先级：中

### 新 Skill 安装
- 条件：任意 Skill 安装
- 动作：配置上下文协议
- 优先级：中

