## 上下文协议

### 标准上下文格式

```json
{
  "session_id": "会话 ID",
  "timestamp": "时间戳",
  "context_type": "session|prompt|cross-skill",
  "priority": "critical|high|medium|low",
  "tokens": 1234,
  "content": "上下文内容",
  "metadata": {
    "user": "用户 ID",
    "skill": "技能名称",
    "quality_score": 0.85
  }
}
```

### 跨 Skill 上下文共享

- 使用统一协议
- 共享存储位置：`~/.agents/context-store/`
- 依赖追踪：记录上下文来源

