## 自动激活规则

```json
{
  "auto_activate": {
    "enabled": true,
    "conditions": [
      {
        "type": "keyword_match",
        "keywords": ["构建 Skill", "创建技能"],
        "action": "immediate_activate"
      },
      {
        "type": "pattern_match",
        "pattern": "如何.*标准化 | 怎么.*自动化",
        "action": "suggest_activate"
      }
    ],
    "global_scope": true,
    "priority": "high"
  }
}
```

