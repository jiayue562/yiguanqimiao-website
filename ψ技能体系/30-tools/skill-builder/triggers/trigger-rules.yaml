## 与其他 Skills 的关系

```yaml
skill_routes:
  - skill: skill-vetter
    relation: 下游
    description: Skill 构建完成后，自动进行安全审查
    
  - skill: self-improving-agent
    relation: 并行
    description: Skill 使用后，自动收集反馈用于进化
    
  - skill: cron-helper
    relation: 下游
    description: Skill 可配置定时触发
    
  - skill: memory-systems
    relation: 并行
    description: Skill 使用记录写入长期记忆
```

