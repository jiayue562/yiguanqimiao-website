# Product Training Skills · 自动触发规则配置 v1.0.0

## 触发词体系（34词·三级）

### P0 核心触发词（18词）
激活条件：精确匹配或语义相似度≥0.85
```yaml
P0_triggers:
  - 产品培训
  - 话术开发
  - 菜品话术
  - 前厅培训
  - 销售话术
  - 新菜上市培训
  - 产品知识培训
  - 话术手册
  - 产品翻译
  - 销售剧本
  - 场景话术
  - 3+1话术
  - 产品工艺采集
  - 前厅通关
  - 销售转化培训
  - 匠心故事采集
  - 产品价值传递
  - 培训通关考核
```

### P1 扩展触发词（12词）
激活条件：语义相似度≥0.70 且 上下文包含培训/前厅/话术/产品
```yaml
P1_triggers:
  - 产品知识点
  - 菜品故事
  - 卖点提炼
  - 客户利益转化
  - 情景模拟
  - 产品文化
  - 药食同源话术
  - 四季料理话术
  - 商务宴请话术
  - 情侣约会话术
  - 家庭聚餐话术
  - 前厅认知提升
```

### P2 泛化触发词（4词）
激活条件：语义相似度≥0.60 且 无更高优先级Skill抢占
```yaml
P2_triggers:
  - 菜单培训
  - 新品培训
  - 季节性菜品培训
  - 食材知识培训
```

## 场景路由矩阵

```yaml
scene_routing:
  S1_新菜话术开发:
    trigger_pattern: "新菜|话术开发|话术迭代|产品翻译"
    engines: [M1, M2]
    output: "话术卡·3+1结构·三种场景变体"
    
  S2_前厅培训执行:
    trigger_pattern: "前厅培训|新人入职|月度复训|培训执行"
    engines: [M3, M4]
    output: "培训通关报告"
    
  S3_场景剧本更新:
    trigger_pattern: "销售剧本|场景话术|节日活动|季度更新"
    engines: [M5]
    output: "销售剧本包"
    
  S4_匠心故事采编:
    trigger_pattern: "匠心故事|工艺采集|大师傅|故事采编"
    engines: [M1, M6]
    output: "匠心故事集"
    
  S5_产品知识考核:
    trigger_pattern: "考核|通关|测试|评估"
    engines: [M3, M4]
    output: "考核成绩表+三段漏斗报告"
```

## 抑制规则

```yaml
suppression_rules:
  - when: "TR-SUP 马循德 主Skill 已激活"
    action: "降级为本Skills，作为子模块协助TR-SUP"
  - when: "触发词同时匹配超级店长Skill"
    action: "由超级店长Skill编排调用，不自主激活"
  - when: "非味藏餐饮场景"
    action: "不激活"
```

## 生态接口

```yaml
ecosystem_integration:
  upstream_data_sources:
    - D8_后厨产品工艺数据: "新菜品工艺信息"
    - D9_采购新品入库: "新食材到达通知"
  
  downstream_consumers:
    - TR-SUP: "话术最终审核"
    - 日反馈v3.0: "培训数据纳入HB3/HB4"
    - PERF-MGR: "培训效果指标D9/D10/D11"
    
  cross_trigger_keywords:
    - 产品培训: "触发TR-SUP审核"
    - 话术上线: "通知三店店长"
    - 培训通关: "更新人事档案"
```

## 输出协议标准

```yaml
output_protocol:
  format: "结构化卡片·3+1结构·三种场景变体"
  must_include:
    - "3个卖点(每个≤2句话，前厅15秒内说完)"
    - "1个故事(30秒内讲完能打动客户)"
    - "三种场景变体(商务/情侣/家庭)"
    - "通关标准(3卖点全对+故事感动度达标)"
    - "三段漏斗预测(<60%/60-80%/≥80%)"
  must_not:
    - "话术含虚假夸大内容"
    - "跳过三道验证(后厨/前厅/客户)"
    - "替代面授培训"
```

