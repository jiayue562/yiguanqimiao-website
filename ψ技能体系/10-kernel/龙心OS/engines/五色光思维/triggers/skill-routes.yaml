## 循环路由

### 五色光 ↔ 知行合一

**场景**: 决策→执行→反馈→优化决策的迭代循环

**循环条件**:
- 执行遇到困难
- 需要重新评估决策
- 情况发生变化

**触发词**:
- "执行遇到困难，需要重新讨论"
- "情况变了，需要调整决策"
- "效果不好，换个方案"

**路由动作**:
```json
