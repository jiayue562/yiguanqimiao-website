## 路由优先级

### 高优先级 (自动激活)
1. 五色光 → 知行合一 (决策需要落地)
2. 象思维 → 五色光 (创意需要决策)

### 中优先级 (询问确认)
1. 知识学习 → 五色光 (学习后讨论)
2. 五色光 → 人机协同五象限 (人机分工)
3. 五色光 → 象思维 (需要创意)

### 低优先级 (建议)
1. 五色光 → 知识学习 (补充知识)
2. 易经思维 → 五色光 (智慧转化)

