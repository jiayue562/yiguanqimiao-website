## 上下文感知

### 会话历史感知

**连续团队问题**:
- 如果用户连续提到团队/会议/讨论
- 动作：主动询问"是否需要用五色光思维结构化讨论？"

**决策困难**:
- 如果用户在多个选项间犹豫
- 动作：建议"用五色光思维全面分析各选项"

