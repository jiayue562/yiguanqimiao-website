## 排除规则

### 不触发的情况

**紧急决策**:
- 需要立即行动
- 时间极度紧张
- 建议用红光思维快速决策

**个人小决策**:
- 午餐吃什么
- 穿什么衣服
- 过度结构化

**纯执行任务**:
- 已有明确方案
- 只需要执行
- 建议用知行合一 Skill

**排除关键词**:
- 马上
- 立刻
- 紧急
- 快点
- 随便
- 简单

---

## 协同路由规则

### 前置 Skill 推荐

**知识学习 → 五色光**:
- 条件：用户刚完成知识学习，需要集体讨论
- 触发词："学完了，团队如何讨论应用？"
- 动作：自动推荐五色光

**象思维 → 五色光**:
- 条件：象思维生成创意后需要验证决策
- 触发词："创意很好，如何评估和决策？"
- 动作：自动推荐五色光

