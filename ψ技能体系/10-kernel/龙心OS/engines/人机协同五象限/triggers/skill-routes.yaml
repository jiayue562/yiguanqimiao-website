# 人机协同五象限协同路由

> 🔗 Skill 协同路由配置 · 知识学习/知行合一/象思维/五色光

---

## 📋 协同路由概述

### 协同关系

人机协同五象限 Skill 与以下 Skills 有协同关系：

| Skill | 关系类型 | 调用顺序 | 协同说明 |
|-------|----------|----------|----------|
| 知识学习 Skill | 前置/协同 | 知识学习 → 五象限 | 学习成果转化为协作行动 |
| 知行合一 Skill | 协同/后置 | 五象限 → 知行合一 | 协作方案落地执行 |
| 象思维 Skill | 核心依赖 | 象思维 → 五象限 | 第五象限专属引擎 |
| 五色光思维 Skill | 协同 | 五色光 → 五象限 | 多角度评估协作效能 |

### 路由原则

```
1. 任务驱动：根据任务类型自动路由
2. 效能优先：选择最优协作路径
3. 无缝衔接：Skill 间平滑过渡
4. 经验沉淀：每次协同后沉淀经验
```

