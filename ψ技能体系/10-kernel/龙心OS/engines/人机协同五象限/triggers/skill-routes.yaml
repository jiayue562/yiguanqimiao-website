## 📊 路由效能评估

### 评估指标

```yaml
指标 1：路由准确率
  定义：正确路由次数 / 总路由次数
  公式：正确路由 / 总路由 × 100%
  目标：≥ 90%

指标 2：路由时效性
  定义：路由响应时间
  公式：Σ(路由响应时间) / 路由次数
  目标：≤ 5 秒

指标 3：协同成功率
  定义：协同成功次数 / 总协同次数
  公式：成功协同 / 总协同 × 100%
  目标：≥ 85%

指标 4：用户满意度
  定义：用户对协同的满意度
  公式：Σ(满意度评分) / 评价次数
  目标：≥ 4/5

指标 5：经验沉淀率
  定义：沉淀经验的协同次数比例
  公式：沉淀经验次数 / 总协同次数 × 100%
  目标：≥ 70%
```

