## 🎯 复合路由场景

### 场景 1：完整学习 - 协作 - 执行闭环

```yaml
场景 ID: SCENE-01
场景名称：学习转化执行闭环
触发条件:
  - 用户有新领域学习需求
  - 学习后需要行动
  - 行动需要落地执行

路由链路:
  知识学习 Skill → 人机协同五象限 → 知行合一 Skill

详细流程:
  1. 知识学习 Skill
     - 输入：学习主题 + 学习目标
     - 处理：十项认知指令深度学习
     - 输出：知识学习报告

  2. 人机协同五象限
     - 输入：知识学习报告 + 行动需求
     - 处理：匹配协作象限 + 设计方案
     - 输出：人机协同协作方案

  3. 知行合一 Skill
     - 输入：协作方案 + 执行需求
     - 处理：概念落地三阶段
     - 输出：执行方案 + 验证指标

成功标准:
  - 知识掌握 ≥ 80%
  - 协作方案可行
  - 执行落地成功
  - 目标达成 ≥ 70%
```

