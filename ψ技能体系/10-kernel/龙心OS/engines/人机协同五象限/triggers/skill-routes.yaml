## 🔄 协同路由规则

### 路由 1：知识学习 → 五象限

```yaml
路由 ID: ROUTE-KL-01
路由名称：学习成果转化路由
触发条件:
  - 知识学习 Skill 完成学习报告
  - 用户表达"如何用这些知识行动"
  - 检测到学习→行动转化需求

路由逻辑:
  输入：知识学习报告 + 行动需求
  处理:
    1. 分析学习成果
    2. 识别行动场景
    3. 匹配协作象限
    4. 生成协作方案
  输出：人机协同协作方案

示例场景:
  - 学习完市场理论 → 如何用 AI 协作做市场分析
  - 学习完编程知识 → 如何用 AI 协作写代码
  - 学习完设计理论 → 如何用 AI 协作做设计

效能指标:
  - 转化率：学习成果转化为行动的比例
  - 时效性：学习到行动的时间
  - 成功率：行动成功的比例
```

---

### 路由 2：五象限 → 知行合一

```yaml
路由 ID: ROUTE-FQ-01
路由名称：协作方案落地路由
触发条件:
  - 五象限 Skill 生成协作方案
  - 用户表达"如何执行这个方案"
  - 检测到方案→执行落地需求

路由逻辑:
  输入：人机协同协作方案 + 执行需求
  处理:
    1. 分析协作方案
    2. 拆解执行步骤
    3. 设计 MVP 测试
    4. 制定验证指标
  输出：知行合一执行方案

示例场景:
  - 协作方案设计完成 → 如何落地执行
  - 人机分工明确 → 具体执行步骤
  - 效能指标定义 → 如何测量验证

效能指标:
  - 落地率：方案落地执行的比例
  - 达成率：目标达成的比例
  - 迭代速度：方案迭代优化的速度
```

