## 📚 路由使用指南

### 何时使用路由

```
使用路由的场景:
1. 单一 Skill 无法满足需求
2. 需要多 Skill 协同完成
3. 需要完整闭环（学习→协作→执行）
4. 需要多角度评估

不使用路由的场景:
1. 单一 Skill 可独立完成
2. 任务过于简单
3. 时间紧急，需要快速响应
```

### 如何触发路由

```
方式 1：自动触发
  说明：系统检测到路由需求自动触发
  优点：无需用户干预
  缺点：可能误判

方式 2：手动触发
  说明：用户明确请求路由
  示例："请用知识学习 + 五象限+知行合一完整流程"
  优点：准确
  缺点：需要用户了解路由

方式 3：建议触发
  说明：AI 建议路由，用户确认
  示例："建议使用学习转化执行闭环，是否继续？"
  优点：平衡准确与用户控制
  缺点：增加交互轮次
```

