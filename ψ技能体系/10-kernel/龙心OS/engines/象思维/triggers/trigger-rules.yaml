# 象思维 Skill 触发规则

> 🎯 自动触发配置 · P0/P1/P2 三级触发

---

## 触发优先级

### P0 直接触发 (权重: 5)
**行为**: 立即激活象思维 Skill，无需确认

**触发词**:
- 象思维
- 观物取象
- 立象尽意
- 取象比类
- 观象制器
- 0→1 原创
- 原创突破
- 创造性问题
- 未知探索
- 跨域创新
- 类比推理
- 隐喻思维
- 整体性思维
- 阴阳五行
- 易经思维
- 东方智慧
- holistic thinking
- 从 0 到 1
- 从无到有

---

### P1 场景触发 (权重: 4)
**行为**: 询问用户是否使用象思维 Skill

**触发场景**:
- 这个问题没有标准答案
- 需要创意
- 需要灵感
- 开创性
- 这个像什么
- 这让我想到
- 类比一下
- 整体来看
- 从更高维度
- 换个角度
- 有什么类似的
- 让我想到什么

---

### P2 信号触发 (权重: 3)
**行为**: 建议使用象思维 Skill

**触发信号** (正则匹配):
- `不知道.*怎么办` (探索性问题)
- `如何.*创新` (创造性问题)
- `.*的本质是什么` (本质探询)
- `有没有.*类似` (类比需求)
- `.*像什么` (隐喻需求)
- `怎么.*突破` (突破瓶颈)
- `新.*方向` (方向探索)

---

## 排除规则

### 不触发的情况

**已有标准答案**:
- 数学计算问题
- 事实查询问题
- 技术规范问题
- 代码调试问题

**需要精确数据**:
- 财务分析
- 市场调研
- 性能测试
- 数据统计

**需要逻辑证明**:
- 法律论证
- 科学验证
- 数学证明

**排除关键词**:
- 计算
- 查询
- 验证
- 证明
- 调试
- 测试
- 数据
- 统计

---

## 协同路由规则

### 前置 Skill 推荐

**知识学习 → 象思维**:
- 条件: 用户刚完成深度学习，需要创新
- 触发词: "学完了，怎么用？" "基于这个，有什么创新想法？"
- 动作: 自动推荐象思维

**五色光思维 → 象思维**:
- 条件: 多角度理解后需要创造
- 触发词: "理解了，现在需要创意"
- 动作: 自动推荐象思维

---

### 后置 Skill 推荐

**象思维 → 知行合一**:
- 条件: 创意方案生成后需要落地
- 触发词: "方案很好，怎么执行？" "如何落地？"
- 动作: 自动推荐知行合一

**象思维 → 人机协同五象限**:
- 条件: 创意需要人机协作执行
- 触发词: "这个方案人和 AI 怎么分工？"
- 动作: 自动推荐人机协同五象限

---

## 上下文感知

### 会话历史感知

**连续创造性问题**:
- 如果用户连续 3 个问题都是创造性问题
- 动作: 主动询问"是否需要我用象思维帮您系统分析？"

**问题复杂度上升**:
- 如果问题从简单→复杂
- 动作: 建议"这个问题比较复杂，建议用象思维整体把握"

---

### 用户偏好学习

**记录用户选择**:
- 用户对 P1/P2 触发的接受/拒绝
- 用户对输出质量的评分
- 用户偏好的意象类型

**个性化调整**:
- 根据历史接受率调整触发频率
- 根据偏好调整意象选择

