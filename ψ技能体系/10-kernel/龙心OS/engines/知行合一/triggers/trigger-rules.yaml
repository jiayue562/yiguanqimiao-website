## 🚨 异常处理规则

```yaml
exception_handling:
  # 概念过于抽象
  too_abstract:
    pattern: "幸福 | 成功 | 人生意义"
    response: "这个概念比较抽象，建议先澄清具体定义。您能说说 [概念] 对您来说具体指什么吗？"
  
  # 标签无法拆解
  cannot_decompose:
    pattern: "不知道.*组成 | 说不清楚"
    response: "概念定义不够清晰，我们先来澄清一下：这个概念试图解决什么问题？由哪些基本要素构成？"
  
  # 核心优势过多
  too_many_advantages:
    threshold: 5
    response: "识别出较多优势，根据认知负荷理论，建议聚焦 1-3 个核心优势。我们来按优先级排序..."
  
  # 场景匹配度低
  low_scenario_fit:
    threshold: 8
    response: "当前场景与核心优势匹配度较低，建议重新选择场景或调整优势定位。"
  
  # 验证指标无法量化
  cannot_quantify:
    pattern: "无法衡量 | 不好量化"
    response: "我们尝试转化为代理指标或行为指标。例如，'用户满意度'可以转化为'NPS 评分'或'复购率'。"
```

