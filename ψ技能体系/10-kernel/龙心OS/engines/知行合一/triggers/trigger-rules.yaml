# 知行合一触发规则配置

---

## 🎯 触发词权重表

### P0 直接触发词（权重 5·绝对触发）

```yaml
direct_triggers:
  weight: 5
  keywords:
    - 知行合一
    - 知行合一思维
    - 知行合一三阶段
    - 概念落地
    - 抽象转具体
    - 从知道到做到
    - 帮我分析
    - 的本质是什么
    - 如何把.*转化为行动
    - .*怎么落地
    - .*的实操方案
    - .*的商业化路径
```

**触发行为**：立即激活，无需额外确认

---

### P1 场景触发词（权重 4·强触发）

```yaml
scenario_triggers:
  weight: 4
  keywords:
    - 如何实施
    - 怎么做
    - 落地实施
    - 行动方案
    - 执行计划
    - 转化路径
    - 变现模式
    - 商业闭环
    - 从 0 到 1
    - 第一步做什么
```

**触发行为**：激活，但询问确认场景

---

### P2 信号触发（权重 3·弱触发）

```yaml
signal_triggers:
  weight: 3
  patterns:
    - "知道.*但.*做不到"
    - "明白.*但是.*不知道.*做"
    - "理论.*实践.*脱节"
    - "概念.*落地.*困难"
    - "想.*但是.*不知道.*开始"
```

**触发行为**：建议激活，提供简要说明

---

## 📊 触发阈值配置

```yaml
activation_thresholds:
  # 总分≥5：直接激活
  direct_activation: 5
  
  # 总分 3-4：询问确认
  confirm_activation: 3
  
  # 总分<3：不激活，建议其他 Skill
  no_activation: 0
  
  # 多关键词叠加规则
  stacking_rule: "max"  # 取最高权重，不累加
```

