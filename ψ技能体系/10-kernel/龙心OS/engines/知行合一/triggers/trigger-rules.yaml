## ⚙️ 自动触发规则

```yaml
auto_activate:
  # 自动触发条件
  conditions:
    - pattern: "帮我分析.*概念"
      action: "直接激活"
    
    - pattern: ".*如何落地.*"
      action: "直接激活"
    
    - pattern: "从知道到做到"
      action: "直接激活"
  
  # 需要确认的条件
  require_confirm:
    - pattern: ".*怎么做.*"
      reason: "可能是简单操作问题，确认是否需要完整分析"
    
    - pattern: ".*实施方案.*"
      reason: "确认是否有具体场景"
  
  # 不触发的条件
  exclude:
    - pattern: ".*创意.*"
      reason: "创意发散不适合知行合一"
    
    - pattern: ".*灵感.*"
      reason: "灵感类问题不适合知行合一"
    
    - pattern: ".*感觉.*"
      reason: "情感类问题不适合知行合一"
```

