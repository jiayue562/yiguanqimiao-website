## 🔗 与其他 Skills 的协同路由

```yaml
skill_routes:
  # 前置 Skill
  prerequisites:
    - skill: 知识学习 Skill
      condition: "用户首次接触概念"
      action: "先学习概念背景，再落地分析"
  
  # 协同 Skill
  collaborators:
    - skill: 象思维 Skill
      condition: "需要深度洞察概念本质"
      action: "先观象，再落地"
    
    - skill: 五色光思维 Skill
      condition: "需要多角度分析"
      action: "先用五色光分析，再知行合一落地"
    
    - skill: 人机协同五象限 Skill
      condition: "方案需要执行"
      action: "知行合一出方案，五象限执行"
  
  # 后置 Skill
  followups:
    - skill: 人机协同五象限 Skill
      condition: "行动方案已生成"
      action: "进入执行阶段"
```

