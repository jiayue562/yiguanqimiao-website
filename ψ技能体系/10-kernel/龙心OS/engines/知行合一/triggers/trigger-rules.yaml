## 📈 触发效果追踪

```yaml
tracking:
  # 追踪指标
  metrics:
    - trigger_accuracy: 触发准确率
    - false_positive: 误触发次数
    - user_satisfaction: 用户满意度
    - execution_success: 执行成功率
  
  # 数据收集
  data_collection:
    - trigger_keyword: 触发关键词
    - activation_result: 激活结果（直接/确认/拒绝）
    - user_feedback: 用户反馈
    - output_quality: 输出质量评分
  
  # 优化周期
  optimization_cycle: "weekly"
  
  # 权重调整规则
  weight_adjustment:
    - condition: "连续 3 次误触发"
      action: "降低该关键词权重 1 级"
    
    - condition: "连续 5 次成功触发"
      action: "提升该关键词权重 1 级（上限 5）"
```

