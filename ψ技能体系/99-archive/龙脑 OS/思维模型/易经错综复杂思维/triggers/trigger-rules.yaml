## 排除规则

```yaml
exclude_rules:
  - 场景：简单二元选择
    关键词：["随便", "都可以", "无所谓"]
    处理：不触发，建议用硬币决策
    
  - 场景：紧急危机
    关键词：["紧急", "马上", "立刻", "危机"]
    处理：不触发，建议先行动后反思
    
  - 场景：纯技术问题
    关键词：["代码", "bug", "技术实现", "配置"]
    处理：不触发，建议用专业方法论
    
  - 场景：创意灵感
    关键词：["创意", "灵感", "点子", "头脑风暴"]
    处理：不触发，建议用象思维或 SCAMPER 法
```

