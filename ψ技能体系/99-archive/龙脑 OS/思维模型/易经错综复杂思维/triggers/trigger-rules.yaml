## P2 信号触发（权重 3·建议使用）

```yaml
p2_signals:
  - 信号："这个问题太复杂了"
    建议文本："是否可以用五卦思维理清思路？从本卦、变卦、互卦、错卦、综卦五个维度分析。"
    
  - 信号："不知道对方怎么想"
    建议文本："是否可以用综卦思维换位审视？站在对方角度看看是什么风景。"
    
  - 信号："感觉走投无路"
    建议文本："是否可以用错卦思维寻找反面转机？否极泰来，反面可能藏着机遇。"
    
  - 信号："看不清趋势"
    建议文本："是否可以用变卦思维预判走向？本卦是现在，变卦是未来。"
    
  - 信号："表面是这样，但感觉不对"
    建议文本："是否可以用互卦思维深挖内因？看看背后有哪些隐藏的力量。"
```

**触发响应**: 建议使用，用户选择后激活。

