## 协同路由

```yaml
协同路由:
  - 前置 Skill: 象思维
    条件：用户需要先直观把握局面
    动作：先调用象思维，再调用易经错综复杂思维
    
  - 前置 Skill: 五行分类图谱
    条件：用户问题涉及五行属性
    动作：先调用五行分类，辅助卦象解读
    
  - 后置 Skill: 五色光思维
    条件：五卦分析完成后
    动作：调用五色光进行多维度验证
    
  - 后置 Skill: 知行合一
    条件：形成决策建议后
    动作：调用知行合一落地执行
```

