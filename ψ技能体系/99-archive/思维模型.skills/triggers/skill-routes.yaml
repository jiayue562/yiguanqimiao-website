## 路由示例

### 示例 1: 超级个体落地项目

```
龙心 OS（场景识别：S4 分析决策）
    ↓
龙爪 OS（执行项目）
    ↓
思维模型.skills（推荐：第一性原理 + MECE）
    ↓
应用模型 → 输出分析
    ↓
知行合一（转化为行动计划）
```

### 示例 2: 战略决策

```
龙心 OS（场景识别：S5 重大决策）
    ↓
思维模型.skills（推荐：SWOT + 波特五力 + 第一性原理）
    ↓
五色光思维（多维度验证）
    ↓
输出综合战略建议
```

