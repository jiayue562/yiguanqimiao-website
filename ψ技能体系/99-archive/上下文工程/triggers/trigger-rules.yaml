trigger-rules:
  - keywords: ["上下文快照", "保存上下文", "恢复任务", "接力棒", "context snapshot", "任务接力", "记录进度"]
    weight: 5
  - keywords: ["会话要过期", "中断后继续", "先保存进度", "记录当前状态", "下次继续", "明天继续", "稍后继续", "先到这里"]
    weight: 4
  - keywords: ["第一阶段完成", "里程碑", "阶段总结", "保存工作", "先记下来"]
    weight: 3
  - keywords: []
    weight: 2
    detect:
      conditions:
        - "对话轮次 > 30 且未生成快照"
        - "检测到中断信号词"
        - "任务状态=进行中 且 会话即将关闭"
