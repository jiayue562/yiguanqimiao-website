<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>关系测评报告 · 五行人格学</title>
<link rel="stylesheet" href="../style.css">
<style>
  .qtable { width:100%; border-collapse:collapse; font-size:14px; margin-top:10px; }
  .qtable th, .qtable td { border:1px solid #E3DCCB; padding:9px 11px; text-align:left; }
  .qtable th { background:#FAEEDA; font-weight:700; }
  .vbig { font-size:25px; font-weight:700; color:#854F0B; }
  .quad4 { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:14px; }
  .quad4 .qb { min-width:0; border:1px solid #E3DCCB; border-radius:12px; padding:16px; background:#FFFDF8; }
  .quad4 .qb h4 { margin:0 0 8px; font-size:16px; }
  .quad4 .qb .n { font-size:23px; font-weight:700; }
  .lesson { border:2px solid #854F0B; border-radius:14px; padding:20px; margin-top:18px; background:#FFFDF8; }
  .lesson h3 { margin-top:0; color:#854F0B; }
  details.kb { margin:10px 0; border:1px solid #E3DCCB; border-radius:10px; background:#FFFDF8; }
  details.kb summary { cursor:pointer; padding:12px 14px; font-size:15px; }
  details.kb .card { margin:0; border:0; border-top:1px solid #E3DCCB; border-radius:0 0 10px 10px; }
  ul.kblist { margin:8px 0 14px; padding-left:20px; }
  ul.kblist li { margin:9px 0; line-height:1.8; font-size:15px; }
  .kbdef { color:#5F5E5A; font-size:14px; }
  .kbmeta { font-size:13px; color:#8B8578; }
  @media (max-width:560px) {
    .quad4 { grid-template-columns:1fr; gap:10px; }
    .qtable { font-size:13px; }
    .qtable th, .qtable td { padding:7px 8px; }
    .lesson { padding:16px; }
  }
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="../../index.html">以观其妙书院</a>
  <nav><a href="index.html">关系测评</a> <a href="quiz.html?mode=self">补自测卷</a> <a href="quiz.html?mode=other">补他测卷</a></nav>
</header>
<div class="wrap" id="root"><div class="card"><p>加载中…</p></div></div>
<div class="wrap" id="actions" style="display:none">
  <div class="card noprint" style="text-align:center">
    <button class="btn ghost" onclick="window.print()">保存 / 打印报告</button>
    <a class="btn" href="index.html" style="margin-left:10px">返回关系测评入口</a>
  </div>
  <footer>以观其妙书院 · 五行人格关系测评 · 结果为自我探索与关系成长参考，属能量状态描述，非医学诊断。</footer>
</div>
<script src="../data.js"></script>
<script src="knowledge.js"></script>
<script src="../engine.js"></script>
<script src="engine_rel.js"></script>
<script>
(function(){
  var KEYS = { self: "wxr_v1_self", other: "wxr_v1_other" };
  var HISTKEYS = { self: "wxr_hist_v1_self", other: "wxr_hist_v1_other" };
  function load(k) { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } }
  function loadHist(k) { try { var v = JSON.parse(localStorage.getItem(k) || "[]"); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function fmtDate(ts) { return new Date(ts).toLocaleDateString("zh-CN"); }
  var sSelf = load(KEYS.self), sOther = load(KEYS.other);
  var selfDone = !!(sSelf && sSelf.done), otherDone = !!(sOther && sOther.done);
  var params = new URLSearchParams(location.search);
  var mode = params.get("mode");
  if (!mode) mode = selfDone && otherDone ? "rel" : (selfDone ? "self" : (otherDone ? "other" : "none"));
  var root = document.getElementById("root");
  var h = "";

  if (mode === "none") {
    root.innerHTML = "<div class='card'><p>未找到作答记录。请先完成自测卷或他测卷。</p><p><a class='btn' href='index.html'>返回入口</a></p></div>";
    return;
  }

  var selfRes = selfDone ? scoreQuiz(sSelf.ans, QUIZ_DATA) : null;
  var otherRes = otherDone ? scoreQuiz(sOther.ans, QUIZ_DATA) : null;
  var otherName = (sOther && sOther.name) ? sOther.name : "TA";

  /* ---------- 共用渲染件 ---------- */
  function typeCard(res, owner) {
    var t = res.typeState === "能量未显" ? null : TYPES[res.mainType];
    var c = ELEMENT_COLOR[res.mainType || res.sorted[0]];
    var s = "<div class='card' style='background:" + c.light + "'>";
    if (!t) {
      s += "<h2>能量未显（" + owner + "）</h2><p>得分最高为 " + res.P[res.sorted[0]] + " 分（" + res.sorted[0] + " 行，满分 100），未达定型标准（≥11 分）。暂以得分最高行（" + res.sorted[0] + "）作暂定主行，转能量状态描述。</p>";
    } else {
      s += "<h2 style='color:" + EL_TEXT[res.mainType] + "'>" + owner + "：" + t.name + "（" + t.xiang + "）</h2>"
        + "<p class='muted'>定型形态：" + (res.typeState === "复合型" ? "复合型（" + res.mainType + "＋" + res.subType + "）" : "单一型") + "　｜　" + res.mainType + " 行得分 " + res.P[res.mainType] + " / 100</p>"
        + "<p><em>" + t.metaphor + "</em></p><p>" + t.core + "</p>";
    }
    return s + "</div>";
  }
  function stepsPanel(res, owner) {
    var s = "<h3>三步判定（" + owner + "）</h3>";
    var pMax = Math.max(1, res.P[res.sorted[0]]);
    res.sorted.forEach(function(e) {
      var c = ELEMENT_COLOR[e];
      s += "<div class='bar-row'><div class='lbl'>" + e + "</div><div class='track'><div class='fill' style='width:" + (res.P[e] / pMax * 100) + "%;background:" + ELEMENT_COLOR[e].main + "'></div></div><div class='val'>" + res.P[e] + "</div></div>";
    });
    var yy = res.yinYang;
    if (yy) {
      s += "<p class='muted'>阴阳判定：" + res.mainType + "行内 阳 " + yy.y + " 词 / 中间带 " + yy.m + " 词 / 阴 " + yy.n + " 词"
        + (yy.verdict === "阴阳未显" ? " → 阴阳未显" : " → 阳 " + yy.yangPct + "% vs 阴 " + yy.yinPct + "%，" + yy.verdict) + "；行内峰值层 L" + res.mainPeak + "，起点层 L" + res.mainStart + "。</p>";
    }
    return s;
  }
  function segHtml(res, owner) {
    return "<div class='stat3'>"
      + "<div class='stat'><div class='num' style='color:" + SEG_TEXT[1] + "'>" + res.seg[1] + "</div><div class='cap'>健康段（" + owner + "）</div></div>"
      + "<div class='stat'><div class='num' style='color:" + SEG_TEXT[2] + "'>" + res.seg[2] + "</div><div class='cap'>一般段（" + owner + "）</div></div>"
      + "<div class='stat'><div class='num' style='color:" + SEG_TEXT[3] + "'>" + res.seg[3] + "</div><div class='cap'>不健康段（" + owner + "）</div></div>"
      + "<div class='stat'><div class='num'>" + (res.GHI === null ? "—" : res.GHI) + "</div><div class='cap'>GHI（" + owner + "）</div></div></div>";
  }
  function layerHtml(res, owner) {
    var s = "";
    for (var k = 9; k >= 1; k--) {
      var seg = k <= 3 ? 1 : (k <= 6 ? 2 : 3);
      var col = SEG_COLOR[seg];
      var v = res.layers[k], mx = Math.max(1, res.peakVal || 1);
      s += "<div class='bar-row'><div class='lbl'>L" + k + " " + LAYER_NAMES[k] + "</div><div class='track'><div class='fill' style='width:" + (v / mx * 100) + "%;background:" + col + "'></div></div><div class='val'>" + v + "</div></div>";
    }
    if (res.peak) s += "<p style='margin-top:10px'>" + owner + "峰值层：<strong>L" + res.peak + " " + LAYER_NAMES[res.peak] + "</strong></p>";
    return s;
  }
  function wordChips(words, cap) {
    var n = Math.min(words.length, cap || 40);
    var s = "<div class='wordchips'>";
    for (var i = 0; i < n; i++) {
      var w = words[i].it || words[i];
      var c = ELEMENT_COLOR[w.e];
      s += "<span class='chip' style='color:" + EL_TEXT[w.e] + ";border-color:" + EL_TEXT[w.e] + "'>" + w.word + " <span class='muted'>L" + w.layer + "</span></span>";
    }
    return s + "</div>" + (words.length > n ? "<p class='muted'>（显示前 " + n + " 词，共 " + words.length + " 词）</p>" : "");
  }

  /* ---------- 知识库延伸：按「答是」的词逐条给出定稿解释与归类坐标 ---------- */
  function kbSection(ans, who) {
    if (!window.WXKB || !ans) return "";
    var byRow = {}, total = 0;
    QUIZ_DATA.forEach(function(it, i) {
      if (ans[i] !== true) return;
      (byRow[it.e] = byRow[it.e] || []).push(it);
      total++;
    });
    var rows = ["木", "火", "土", "金", "水"].filter(function(e) { return byRow[e]; });
    if (!rows.length) return "";
    var s = "<h2>知识库延伸 · " + who + "确认的词汇释义</h2>"
      + "<p class='muted'>本卷共答「是」<strong>" + total + "</strong> 个词。以下释义取自《五行人格学人格词汇分类与解释表（定稿）》，按行折叠——可核对" + who + "对这些词的理解是否与体系口径一致；同一维度内的词互为边界，读释义末句「区别于……」即可辨同异。</p>";
    rows.forEach(function(e) {
      var list = byRow[e];
      s += "<details class='kb'><summary><strong>" + e + "行</strong> · 确认 " + list.length + " 词 · 展开看释义与归类</summary><div class='card'>";
      var byX = {}, order = [];
      list.forEach(function(it) {
        if (!byX[it.xiang]) { byX[it.xiang] = []; order.push(it.xiang); }
        byX[it.xiang].push(it);
      });
      order.forEach(function(x) {
        s += "<h4>" + x + " 维度</h4><ul class='kblist'>";
        byX[x].sort(function(a, b) { return a.layer - b.layer; }).forEach(function(it) {
          var k = (window.WXKB.words || {})[it.word] || {};
          s += "<li><strong>" + it.word + "</strong>　<span class='muted'>L" + it.layer + (k.f ? " · " + k.f : " · 题库词条") + "</span><br>"
            + "<span class='kbdef'>" + (k.d || it.def || "") + "</span></li>";
        });
        s += "</ul>";
      });
      s += "</div></details>";
    });
    s += "<p class='kbmeta'>出处：" + (window.WXKB.meta && window.WXKB.meta.src ? window.WXKB.meta.src : "《五行人格学人格词汇分类与解释表（定稿）》")
      + (window.WXKB.meta && window.WXKB.meta.srcUrl ? "　<a href='" + window.WXKB.meta.srcUrl + "' target='_blank' rel='noopener'>在公开知识库查看原表 →</a>" : "")
      + (window.WXKB.meta && window.WXKB.meta.stdUrl ? "　｜　<a href='" + window.WXKB.meta.stdUrl + "' target='_blank' rel='noopener'>题目重排清单（唯一标准）→</a>" : "")
      + (window.WXKB.meta && window.WXKB.meta.quizUrl ? "　｜　<a href='" + window.WXKB.meta.quizUrl + "' target='_blank' rel='noopener'>重做测评 →</a>" : "")
      + "　（释义随版本编译固定，保证同一份报告可复现、可追溯）</p>";
    return s;
  }
  function metaLine(store, label) {
    return label + "　作答 " + new Date(store.ts || Date.now()).toLocaleDateString("zh-CN")
      + "　有效作答 " + Object.keys(store.ans).filter(function(k){ return store.ans[k] === true; }).length + " 个「是」词";
  }

  /* ---------- 测评历史与对比（持久化存档：wxr_hist_v1_self / wxr_hist_v1_other） ---------- */
  window.HIST_CTX = {};
  function histSection(sec, histKey, res, owner, curName) {
    window.HIST_CTX[sec] = { histKey: histKey, curRes: res, owner: owner, curName: curName };
    return "<h2>测评历史与对比（" + owner + "）</h2><div class='card' id='" + sec + "Box'><p class='muted'>加载中…</p></div>";
  }
  window.histFill = function(sec, idxStr) {
    var c = window.HIST_CTX[sec]; if (!c) return;
    var box = document.getElementById(sec + "Box"); if (!box) return;
    var hist = loadHist(c.histKey);
    if (!hist.length) {
      box.innerHTML = "<p class='muted'>暂无历史存档。在入口页或答题页点「重新开始」重做并完成后，此处自动给出与上一轮的得分对比与连续变化。</p>";
      return;
    }
    var idx = hist.length - 1;
    if (idxStr !== undefined && idxStr !== null && idxStr !== "") {
      var ni = parseInt(idxStr, 10);
      if (!isNaN(ni)) idx = Math.min(Math.max(ni, 0), hist.length - 1);
    }
    var cur = c.curRes;
    var base = scoreQuiz(hist[idx].ans, QUIZ_DATA);
    var curMain = cur.mainType || cur.sorted[0];
    var baseMain = base.mainType || base.sorted[0];
    function dc(a, b) {
      var d = b - a;
      if (d > 0) return "<span style='color:#3B6D11;font-weight:600'>▲ +" + d + "</span>";
      if (d < 0) return "<span style='color:#C0392B;font-weight:600'>▼ " + d + "</span>";
      return "<span class='muted'>0</span>";
    }
    function typeStr(res) { return res.typeState === "能量未显" ? "能量未显" : (res.mainType || res.sorted[0]) + "行人"; }
    function pctStr(res) {
      var yy = res.yinYang;
      if (!yy || yy.verdict === "阴阳未显") return "阴阳未显";
      return "阳 " + yy.yangPct + "% / 阴 " + yy.yinPct + "%（" + yy.verdict + "）";
    }
    function layerStr(res) { return (res.mainPeak || res.peak) ? "L" + (res.mainPeak || res.peak) : "—"; }
    function layerCmp(a, b) {
      if (!a || !b) return "—";
      if (b < a) return "<span style='color:#3B6D11;font-weight:600'>↑ L" + a + "→L" + b + "（向健康段移动）</span>";
      if (b > a) return "<span style='color:#C0392B;font-weight:600'>↓ L" + a + "→L" + b + "（向深层移动）</span>";
      return "持平（L" + b + "）";
    }
    var s = "";
    if (hist.length > 1) {
      s += "<p><strong>选择对比基准：</strong><select onchange=\"window.histFill('" + sec + "', this.value)\">";
      for (var i = hist.length - 1; i >= 0; i--) {
        s += "<option value='" + i + "'" + (i === idx ? " selected" : "") + ">第 " + (i + 1) + " 轮 · " + fmtDate(hist[i].ts) + (i === hist.length - 1 ? "（最近）" : "") + "</option>";
      }
      s += "</select></p>";
    }
    s += "<h4>五行得分对比（满分 100）：第 " + (idx + 1) + " 轮（" + fmtDate(hist[idx].ts) + "）→ 本次</h4>"
      + "<table class='qtable'><tr><th>行</th><th>上次</th><th>本次</th><th>变化</th></tr>";
    cur.sorted.forEach(function(e) {
      s += "<tr><td><strong>" + e + "</strong>" + (curMain === e ? "（主行）" : "") + "</td><td>" + base.P[e] + "</td><td>" + cur.P[e] + "</td><td>" + dc(base.P[e], cur.P[e]) + "</td></tr>";
    });
    s += "</table>";
    var typeChg = baseMain !== curMain;
    s += "<h4 style='margin-top:12px'>关键判定变化</h4><ul>"
      + "<li><strong>主导类型</strong>：" + typeStr(base) + "（" + base.P[baseMain] + "）→ " + typeStr(cur) + "（" + cur.P[curMain] + "）" + (typeChg ? "　<span style='color:#854F0B;font-weight:600'>⚠ 主行改变</span>" : "") + "</li>"
      + "<li><strong>阴阳属性</strong>：" + pctStr(base) + " → " + pctStr(cur) + "</li>"
      + "<li><strong>峰值层</strong>（主行内）：" + layerCmp(base.mainPeak, cur.mainPeak) + "</li>"
      + "<li><strong>三段能量</strong>：健康 " + base.seg[1] + "→" + cur.seg[1] + "（" + dc(base.seg[1], cur.seg[1]) + "）｜一般 " + base.seg[2] + "→" + cur.seg[2] + "（" + dc(base.seg[2], cur.seg[2]) + "）｜不健康 " + base.seg[3] + "→" + cur.seg[3] + "（" + dc(base.seg[3], cur.seg[3]) + "；不健康段下降＝改善）</li>"
      + "<li><strong>GHI</strong>：" + (base.GHI === null ? "—" : base.GHI) + " → " + (cur.GHI === null ? "—" : cur.GHI) + (base.GHI !== null && cur.GHI !== null ? "（" + dc(base.GHI, cur.GHI) + "）" : "") + "</li></ul>"
      + "<p class='muted'>▲/绿＝数值升高，▼/红＝数值下降。五行得分与健康段计数升高通常为改善信号；不健康段计数与峰值层号下降为改善信号。</p>";
    s += "<h4 style='margin-top:12px'>历次测评轨迹（含本次）</h4><table class='qtable'><tr><th>轮次</th><th>日期</th>"
      + (sec === "histOther" ? "<th>对象</th>" : "") + "<th>主导型</th><th>主行得分</th><th>峰值层</th></tr>";
    hist.forEach(function(rec, i) {
      var r = scoreQuiz(rec.ans, QUIZ_DATA);
      var mt = r.mainType || r.sorted[0];
      s += "<tr><td>第 " + (i + 1) + " 轮</td><td>" + fmtDate(rec.ts) + "</td>"
        + (sec === "histOther" ? "<td>" + (rec.name || "TA") + "</td>" : "")
        + "<td>" + (r.typeState === "能量未显" ? "能量未显" : mt + "行人") + "</td><td>" + r.P[mt] + "</td><td>" + layerStr(r) + "</td></tr>";
    });
    s += "<tr style='background:#FAEEDA'><td><strong>本次</strong></td><td>" + fmtDate(Date.now()) + "</td>"
      + (sec === "histOther" ? "<td>" + (c.curName || "TA") + "</td>" : "")
      + "<td>" + typeStr(cur) + "</td><td>" + cur.P[curMain] + "</td><td>" + layerStr(cur) + "</td></tr>";
    s += "</table><p class='muted'>历史存档保留最近 20 轮，存在你的浏览器本地，不上传服务器。</p>";
    box.innerHTML = s;
  };

  /* ---------- 模式A：自测报告 ---------- */
  if (mode === "self") {
    var a = buildAdvice(selfRes);
    h += "<h1>自测报告（关系测评 · 模式A）</h1><p class='muted'>" + metaLine(sSelf, "本人自测卷") + "</p>";
    h += typeCard(selfRes, "你");
    h += "<h2>五行得分与三步判定</h2><div class='card'>" + stepsPanel(selfRes, "你") + "</div>";
    h += "<h2>三段能量剖面</h2>" + segHtml(selfRes, "你");
    h += "<h2>九层定位</h2><div class='card'>" + layerHtml(selfRes, "你") + "</div>";
    h += "<h2>起点建议</h2><div class='card'>" + a.html + "</div>";
    h += kbSection(sSelf.ans, "你");
    h += histSection("histSelf", HISTKEYS.self, selfRes, "你", "你");
    if (otherDone) {
      h += "<div class='card' style='background:#FAEEDA'><p>他测卷已完成——<a class='btn' href='report.html?mode=rel'>查看完整关系测评报告</a></p></div>";
    } else {
      h += "<div class='card'><p>完成他测卷（我测 " + otherName + "）后，将自动生成<strong>关系测评报告</strong>（四象限 + 生克分型 + 双线功课）。</p><p><a class='btn' href='quiz.html?mode=other'>去做他测卷</a></p></div>";
    }
    document.getElementById("actions").style.display = "block";
    root.innerHTML = h;
    window.histFill("histSelf");
    return;
  }

  /* ---------- 他测摘要 ---------- */
  if (mode === "other") {
    h += "<h1>他测摘要（你眼中的 " + otherName + "）</h1><p class='muted'>" + metaLine(sOther, "他测卷") + "</p>";
    h += "<div class='card' style='background:#FAEEDA'><p><strong>视角边界</strong>：以下为「你眼中 " + otherName + "」的能量画像——是他测窗口的数据，不是 " + otherName + " 的自知。报告据此做关系分析，不作为对 " + otherName + " 的独立人格论断。</p></div>";
    h += typeCard(otherRes, otherName + "（你眼中）");
    h += "<h2>五行得分与三步判定</h2><div class='card'>" + stepsPanel(otherRes, otherName) + "</div>";
    h += "<h2>三段能量剖面</h2>" + segHtml(otherRes, otherName);
    h += "<h2>九层定位</h2><div class='card'>" + layerHtml(otherRes, otherName) + "</div>";
    h += kbSection(sOther.ans, "你眼中的 " + otherName);
    h += histSection("histOther", HISTKEYS.other, otherRes, "你眼中的 " + otherName, otherName);
    if (selfDone) {
      h += "<div class='card' style='background:#FAEEDA'><p>自测卷已完成——<a class='btn' href='report.html?mode=rel'>查看完整关系测评报告</a></p></div>";
    } else {
      h += "<div class='card'><p>完成自测卷后，将自动生成<strong>关系测评报告</strong>。</p><p><a class='btn' href='quiz.html?mode=self'>去做自测卷</a></p></div>";
    }
    document.getElementById("actions").style.display = "block";
    root.innerHTML = h;
    window.histFill("histOther");
    return;
  }

  /* ---------- 模式B：完整关系测评报告 ---------- */
  var rel = computeRelation(sSelf.ans, sOther.ans, QUIZ_DATA);
  rel.otherName = otherName;
  var pack = relLessonPack(rel);
  var aSelf = buildAdvice(rel.selfRes);

  h += "<h1>关系测评报告</h1><p class='muted'>" + metaLine(sSelf, "自测卷") + "　｜　" + metaLine(sOther, "他测卷（" + otherName + "）") + "</p>";

  /* 第一部分 · 本人测评 */
  h += "<h2>第一部分 · 你的测评</h2>";
  h += typeCard(rel.selfRes, "你");
  h += "<div class='card'>" + stepsPanel(rel.selfRes, "你") + "</div>";
  h += segHtml(rel.selfRes, "你");
  h += "<div class='card'>" + layerHtml(rel.selfRes, "你") + "</div>";
  h += "<div class='card'>" + aSelf.html + "</div>";
  h += kbSection(sSelf.ans, "你");

  /* 第二部分 · 测他摘要 */
  h += "<h2>第二部分 · 测他摘要（你眼中的 " + otherName + "）</h2>";
  h += "<div class='card' style='background:#FAEEDA'><p><strong>视角边界</strong>：此为你眼中 " + otherName + " 的画像（他测窗口），非对方自知，不作为对 " + otherName + " 的独立人格论断。</p></div>";
  h += typeCard(rel.otherRes, otherName + "（你眼中）");
  h += "<div class='card'>" + stepsPanel(rel.otherRes, otherName) + "</div>";
  h += segHtml(rel.otherRes, otherName);
  h += "<div class='card'>" + layerHtml(rel.otherRes, otherName) + "</div>";
  h += kbSection(sOther.ans, "你眼中的 " + otherName);

  /* 测评历史与对比（两卷各自与其历史存档对比；关系指标四档对比属二期复测报告） */
  h += histSection("histSelf", HISTKEYS.self, rel.selfRes, "你", "你");
  h += histSection("histOther", HISTKEYS.other, rel.otherRes, "你眼中的 " + otherName, otherName);

  /* 第三部分 · 关系篇 */
  h += "<h2>第三部分 · 关系篇</h2>";

  /* 关系篇一 · 关系窗（四象限，仅双方主行词库） */
  h += "<h3>关系窗 · 关系四象限词级分布</h3>";
  h += "<p class='muted'>统计范围：双方主行词库（<strong>" + rel.scopeText + "，你=" + rel.P.mainType + " / " + otherName + "=" + rel.Q.mainType + "）</strong>——其他行词不参与整理与统计。空白区聚合表同理仅列主行。</p><div class='quad4'>";
  var qn = [["resonance", "共鸣区", "我认己亦见人——关系的共同语言（起点区）", "#3B6D11"],
            ["projection", "投射区", "我在 TA 身上看见、却不在自己身上选出的词——先求证，后定义", "#185FA5"],
            ["defense", "防御区", "我身上呈现而 TA 未回应的部分——暴露练习", "#854F0B"],
            ["blank", "空白区", "双方都未激活的词——关系未开发区（只聚合，不逐词）", "#8B8578"]];
  qn.forEach(function(q) {
    h += "<div class='qb'><h4>" + q[1] + "　<span class='n' style='color:" + q[3] + "'>" + rel.quad[q[0]].length + " 词</span></h4>"
      + "<p class='muted'>" + q[2] + "</p></div>";
  });
  h += "</div>";
  ["resonance", "projection", "defense"].forEach(function(q) {
    if (rel.quad[q].length) {
      h += "<div class='card'><h4>" + relQName(q) + "词清单（" + rel.quad[q].length + " 词）</h4>" + wordChips(rel.quad[q], 40) + "</div>";
    }
  });
  if (rel.quad.blank.length) {
    h += "<div class='card'><h4>空白区聚合（行 × 层计数，不逐词）</h4><table class='qtable'><tr><th>行</th>";
    for (var k = 1; k <= 9; k++) h += "<th>L" + k + "</th>";
    h += "</tr>";
    rel.scopeRows.forEach(function(e) {
      if (!rel.blankGrid[e]) return;
      h += "<tr><td><strong>" + e + "</strong></td>";
      for (var k2 = 1; k2 <= 9; k2++) h += "<td>" + (rel.blankGrid[e][k2] || "") + "</td>";
      h += "</tr>";
    });
    h += "</table></div>";
  }

  /* 关系篇二 · 关系分型 */
  h += "<h3>关系分型 · 相生 / 相克判定</h3><div class='card'>";
  h += "<p class='vbig'>" + rel.verdict + "</p>";
  h += "<p><strong>" + rel.dirText + "</strong>——关系方向按双方主类型判定（相生：木→火→土→金→水→木；相克：木克土→土克水→水克火→火克金→金克木）。</p>";
  h += "<p>统计范围：双方主行词库（<strong>" + rel.scopeText + "</strong>）。范围内生证据 S = <strong>" + rel.sAll + "</strong>（其中共鸣区 " + rel.sR + "），克证据 K = <strong>" + rel.kAll + "</strong>（其中共鸣区 " + rel.kR + "）——作为方向佐证与功课素材呈现。</p>";
  if (rel.rl) h += "<p>关系层级指数 RL = <strong>L" + rel.rl + " " + LAYER_NAMES[rel.rl] + "</strong>（双方峰值层中更深的一方拖住关系整体）。克证据规则：阴面词克阳面词才计入（阳对阳克＝调节磨合，不计损伤）。</p>";
  h += "<h4>克证据对表（按 K 分降序，前 10）</h4>";
  if (rel.kePairs.length) {
    h += "<table class='qtable'><tr><th>源词（克方）</th><th>靶词（被克方·阳面）</th><th>K 分</th><th>计入共鸣区判定</th></tr>";
    rel.kePairs.slice(0, 10).forEach(function(p) {
      h += "<tr><td>" + (p.side === "self" ? "我" : otherName) + "的「" + p.src.word + "」（" + p.src.e + " L" + p.src.layer + "，" + relQName(p.srcQ) + "）</td>"
        + "<td>" + (p.side === "self" ? otherName : "我") + "的「" + p.tgt.word + "」（" + p.tgt.e + " L" + p.tgt.layer + "）</td>"
        + "<td>" + p.score.toFixed(3) + "</td><td>" + (p.bothRes ? "✓" : "—") + "</td></tr>";
    });
    h += "</table><p class='muted'>共 " + rel.kePairs.length + " 条克证据对（完整对表可向施测者导出）。</p>";
  } else {
    h += "<p>克证据对为零——无阴克阳损伤路径（相生关系的常见形态）。</p>";
  }
  h += "<h4>生证据对表（按 S 分降序，前 10）</h4>";
  if (rel.shengPairs.length) {
    h += "<table class='qtable'><tr><th>源词（生方·阳面）</th><th>靶词（被生方·阳面）</th><th>S 分</th><th>计入共鸣区判定</th></tr>";
    rel.shengPairs.slice(0, 10).forEach(function(p) {
      h += "<tr><td>" + (p.side === "self" ? "我" : otherName) + "的「" + p.src.word + "」（" + p.src.e + " L" + p.src.layer + "）</td>"
        + "<td>" + (p.side === "self" ? otherName : "我") + "的「" + p.tgt.word + "」（" + p.tgt.e + " L" + p.tgt.layer + "）</td>"
        + "<td>" + p.score.toFixed(3) + "</td><td>" + (p.bothRes ? "✓" : "—") + "</td></tr>";
    });
    h += "</table><p class='muted'>共 " + rel.shengPairs.length + " 条生证据对。</p>";
  } else {
    h += "<p>生证据对为零（罕见）——建议复测核实。</p>";
  }
  h += "</div>";

  /* 关系篇三 · 关系行动 */
  h += "<h3>关系行动 · 四象限分区措施</h3><div class='card'><ul>"
    + "<li><strong>共鸣区（起点区）</strong>：所有关系改善从共识的词出发——相生措施把生链互动固化为习惯锚点；克对在克源词上落通关点修炼。首月只做共鸣区（起点纪律）。</li>"
    + "<li><strong>投射区（" + rel.quad.projection.length + " 词）</strong>：求证练习——以具体事例核对该词是否属实，避免标签化 " + otherName + "；同时自照检查自己是否也有此词（自照用「找好处」降低防御）。</li>"
    + "<li><strong>防御区（" + rel.quad.defense.length + " 词）</strong>：暴露练习——「在我感到 X 之后，我告诉对方这个词」的词级表达微行为。</li>"
    + "<li><strong>空白区（" + rel.quad.blank.length + " 词）</strong>：不强制行动，聚合呈现「共同未开发区」——见上方行 × 层计数表。</li></ul></div>";

  h += "<h2>功课包（本轮 3 个月 · 双主线）</h2>";
  if (pack.shengCard) h += "<div class='lesson'>" + pack.shengCard + "</div>";
  if (pack.keCard) h += "<div class='lesson'>" + pack.keCard + "</div>";
  h += "<div class='lesson'>" + pack.daily + "</div>";
  h += "<div class='lesson'>" + pack.map90 + "</div>";

  h += "<div class='card'><p><strong>复测提示</strong>：第 13 周（3 个月 ±7 天）用同一套卷重做双窗口，系统将对比克线（主克 K 分下降 ≥30%）与生线（主生 S 分维持 ≥95%）及双方峰值层位移，出四档判定（大效 / 显效 / 有效 / 未显效）。重做方式：入口页对应卷卡上点「重新开始」→ 重做完成 → 本报告「测评历史与对比」区自动给出与上一轮的得分差异与连续变化（关系指标四档对比属二期复测报告）。</p></div>";

  document.getElementById("actions").style.display = "block";
  root.innerHTML = h;
  window.histFill("histSelf");
  window.histFill("histOther");
})();
</script>
</body>
</html>
